<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Свадебное приглашение | Артём & Анастасия</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #67869A;
      font-family: 'Playfair Display', 'Georgia', serif;
      line-height: 1.45;
      min-height: 100vh;
      padding: 0;
      margin: 0;
    }

    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:opsz,wght@14..32,300;400;500&family=Great+Vibes&display=swap');

    .wrapper {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 20px;
    }

    .beige-card {
      background-color: #F4EBE9;
      border-radius: 48px 32px 48px 32px;
      box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.2) inset;
      padding: 2rem;
      transition: all 0.2s;
    }

    .hero-section {
      position: relative;
      margin-bottom: 1.5rem;
    }
    .hero-image {
      width: 100%;
      height: auto;
      min-height: 240px;
      object-fit: cover;
      border-radius: 40px;
      display: block;
      box-shadow: none;
    }
    .hero-section::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100px;
      background: linear-gradient(to bottom, rgba(244, 235, 233, 0) 0%, #F4EBE9 100%);
      pointer-events: none;
      border-radius: 0 0 40px 40px;
    }

    .names-calligraphy {
      text-align: center;
      margin: 0.5rem 0 1.5rem 0;
    }
    .names-calligraphy h1 {
      font-family: 'Great Vibes', cursive;
      font-size: 4rem;
      font-weight: 400;
      color: #3A4F5C;
      letter-spacing: 2px;
    }
    .ampersand {
      font-family: 'Great Vibes', cursive;
      font-size: 3.8rem;
      color: #8B6B5B;
    }

    .main-title {
      text-align: center;
      font-family: 'Playfair Display', serif;
      font-weight: 600;
      font-size: 2rem;
      letter-spacing: -0.2px;
      color: #3A4F5C;
      margin: 0 0 1.8rem 0;
      border-bottom: 3px solid #DBCFBD;
      display: inline-block;
      width: auto;
      padding-bottom: 6px;
    }
    .title-center {
      text-align: center;
    }

    .couple-block {
      background: rgba(231, 224, 216, 0.45);
      border-radius: 40px;
      padding: 2rem 1.8rem;
      text-align: center;
      margin-bottom: 2rem;
      border-left: 6px solid #E7E0D8;
    }
    .couple-img {
      width: 100%;
      max-height: 500px;
      object-fit: cover;
      border-radius: 36px;
      box-shadow: 0 18px 32px -12px rgba(0, 0, 0, 0.2);
      margin-bottom: 1.2rem;
    }
    .invite-text {
      font-size: 1.5rem;
      font-weight: 500;
      font-family: 'Playfair Display', serif;
      color: #4A5F6A;
      background: #F4EBE9;
      display: inline-block;
      padding: 8px 28px;
      border-radius: 60px;
    }

    .timer-area {
      background: #EDE3DD;
      border-radius: 44px;
      padding: 1.8rem;
      text-align: center;
      margin-bottom: 2rem;
    }
    .timer-head {
      font-size: 1.6rem;
      font-weight: 500;
      font-family: 'Playfair Display', serif;
      color: #2C3E4E;
      margin-bottom: 1rem;
    }
    .timer-flex {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      flex-wrap: wrap;
      margin-bottom: 1.6rem;
    }
    .timer-item {
      background: rgba(198, 209, 217, 0.5);
      backdrop-filter: blur(8px);
      border-radius: 32px;
      padding: 0.7rem 1.2rem;
      min-width: 85px;
      text-align: center;
      border: 1px solid rgba(103,134,154,0.2);
    }
    .timer-num {
      font-size: 2.2rem;
      font-weight: 700;
      font-family: 'Playfair Display', monospace;
      color: #2C3E4E;
      line-height: 1.2;
    }
    .timer-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-family: 'Inter', sans-serif;
      color: #4F6572;
    }
    .map-btn {
      background: #F1F1F1;
      border: none;
      padding: 12px 28px;
      border-radius: 50px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      color: #3E5A68;
      cursor: pointer;
    }
    .map-btn:hover {
      background: white;
    }
    .map-slide {
      overflow: hidden;
      transition: max-height 0.45s ease-out;
      max-height: 0;
      margin-top: 0;
      border-radius: 28px;
    }
    .map-slide.open {
      max-height: 420px;
      margin-top: 1.2rem;
    }
    .map-frame {
      width: 100%;
      height: 360px;
      border-radius: 28px;
      border: 1px solid #C6D1D9;
    }

    .schedule-card {
      margin: 2rem 0;
      background: #E9E0DA;
      border-radius: 48px;
      padding: 1rem;
    }
    .schedule-title {
      font-family: 'Playfair Display', serif;
      font-weight: 600;
      font-size: 1.9rem;
      text-align: center;
      color: #3A4F5C;
      margin: 0.5rem 0 1rem;
    }
    .schedule-img {
      width: 100%;
      border-radius: 36px;
      display: block;
    }

    .form-card {
      background: rgba(231, 224, 216, 0.5);
      border-radius: 40px;
      padding: 1.8rem;
      margin-top: 1rem;
      border-left: 5px solid #E7E0D8;
    }
    .form-title {
      font-size: 1.7rem;
      font-family: 'Playfair Display', serif;
      margin-bottom: 1.2rem;
      color: #3A4F5C;
    }
    .input-group {
      margin-bottom: 1.2rem;
    }
    .input-group label {
      display: block;
      font-weight: 500;
      font-family: 'Inter', sans-serif;
      margin-bottom: 6px;
      color: #4A5F6A;
    }
    input, textarea, select {
      width: 100%;
      padding: 12px 16px;
      border-radius: 60px;
      border: 1px solid #C6D1D9;
      background: #FDF9F6;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
    }
    textarea {
      border-radius: 28px;
      resize: vertical;
    }
    .radio-row {
      display: flex;
      gap: 1.5rem;
      align-items: center;
      flex-wrap: wrap;
    }
    .radio-row label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: normal;
    }
    .send-btn {
      background: #F1F1F1;
      border: none;
      padding: 14px;
      width: 100%;
      border-radius: 60px;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      color: #3E5A68;
      cursor: pointer;
      margin-top: 12px;
    }
    .send-btn:hover {
      background: white;
    }
    hr {
      margin: 24px 0 10px;
      border: 0;
      height: 2px;
      background: #DBCFBD;
    }
    .footer-note {
      text-align: center;
      font-size: 0.8rem;
      color: #7A8D99;
      font-family: 'Inter', sans-serif;
    }

    @media (max-width: 720px) {
      .wrapper {
        padding: 12px;
      }
      .beige-card {
        padding: 1.2rem;
      }
      .hero-image {
        min-height: 160px;
      }
      .names-calligraphy h1 {
        font-size: 2.5rem;
      }
      .ampersand {
        font-size: 2.3rem;
      }
      .main-title {
        font-size: 1.5rem;
      }
      .invite-text {
        font-size: 1.2rem;
      }
      .timer-num {
        font-size: 1.6rem;
      }
      .schedule-title {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
<div class="wrapper">
  <div class="beige-card">
    
    <!-- ШАПКА: файл шапка.png -->
    <div class="hero-section">
      <img class="hero-image" src="шапка.png" alt="шапка">
    </div>

    <!-- Имена под шапкой -->
    <div class="names-calligraphy">
      <h1>Артём <span class="ampersand">&</span> Анастасия</h1>
    </div>

    <div class="title-center">
      <div class="main-title">ПРИГЛАШЕНИЕ НА СВАДЬБУ</div>
    </div>

    <!-- ФОТО МОЛОДОЖЕНОВ: файл МЫ.png (большими буквами) -->
    <div class="couple-block">
      <img class="couple-img" src="МЫ.png" alt="Артём и Анастасия">
      <div class="invite-text">
        Приглашаем вас принять участие в создании нашей семьи
      </div>
    </div>

    <!-- Таймер -->
    <div class="timer-area">
      <div class="timer-head">До торжества осталось</div>
      <div class="timer-flex">
        <div class="timer-item"><div class="timer-num" id="days">00</div><div class="timer-label">Дней</div></div>
        <div class="timer-item"><div class="timer-num" id="hours">00</div><div class="timer-label">Часов</div></div>
        <div class="timer-item"><div class="timer-num" id="minutes">00</div><div class="timer-label">Минут</div></div>
        <div class="timer-item"><div class="timer-num" id="seconds">00</div><div class="timer-label">Секунд</div></div>
      </div>
      <button class="map-btn" id="toggleMap">📍 Открыть карту (Парк-отель Новый Век, г.Энгельс)</button>
      <div id="mapSlide" class="map-slide">
        <iframe class="map-frame" 
                src="https://yandex.ru/map-widget/v1/?ll=46.130309,51.478169&z=17&pt=46.130309,51.478169&l=map"
                frameborder="0"
                allowfullscreen="true"></iframe>
      </div>
    </div>

    <!-- Программа -->
    <div class="schedule-card">
      <div class="schedule-title">Свадебная программа</div>
      <img class="schedule-img" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 400'%3E%3Crect width='800' height='400' fill='%23F4EBE9' rx='32'/%3E%3Ctext x='400' y='55' font-family='Playfair Display, Georgia' font-size='28' font-weight='bold' fill='%233A4F5C' text-anchor='middle'%3EСвадебная программа%3C/text%3E%3Cline x1='120' y1='80' x2='680' y2='80' stroke='%23E7E0D8' stroke-width='2'/%3E%3Ctext x='130' y='130' font-family='Inter, sans-serif' font-size='18' fill='%234A5F6A'%3E14:00 — Сбор гостей, фуршет%3C/text%3E%3Ctext x='130' y='175' font-family='Inter, sans-serif' font-size='18' fill='%234A5F6A'%3E15:00 — Интервью гостей%3C/text%3E%3Ctext x='130' y='220' font-family='Inter, sans-serif' font-size='18' fill='%234A5F6A'%3E15:45 — Церемония регистрации%3C/text%3E%3Ctext x='130' y='265' font-family='Inter, sans-serif' font-size='18' fill='%234A5F6A'%3E16:30 — Фотосессия%3C/text%3E%3Ctext x='130' y='310' font-family='Inter, sans-serif' font-size='18' fill='%234A5F6A'%3E17:00 — Банкет%3C/text%3E%3Ctext x='130' y='355' font-family='Inter, sans-serif' font-size='18' fill='%234A5F6A'%3E23:00 — Конец мероприятия%3C/text%3E%3C/svg%3E"
           alt="Расписание">
    </div>

    <!-- Форма -->
    <div class="form-card">
      <div class="form-title">Подтверждение присутствия</div>
      <form id="rsvpForm">
        <div class="input-group">
          <label>Ваше ФИО</label>
          <input type="text" required>
        </div>
        <div class="input-group">
          <label>Придете ли вы на церемонию?</label>
          <div class="radio-row">
            <label><input type="radio" name="ceremony" value="yes"> Да</label>
            <label><input type="radio" name="ceremony" value="no"> Нет</label>
          </div>
        </div>
        <div class="input-group">
          <label>Придете ли вы на банкет?</label>
          <div class="radio-row">
            <label><input type="radio" name="banquet" value="yes"> Да</label>
            <label><input type="radio" name="banquet" value="no"> Нет</label>
          </div>
        </div>
        <div class="input-group">
          <label>Ваш комментарий</label>
          <textarea rows="2"></textarea>
        </div>
        <button type="submit" class="send-btn">Отправить</button>
        <p style="text-align: center; font-size: 0.7rem; margin-top: 12px; color:#7A8D99;">Функционал формы временно декоративный</p>
      </form>
    </div>
    <hr>
    <div class="footer-note">26 августа 2026 · Парк-отель Новый Век, г.Энгельс</div>
  </div>
</div>

<script>
  function timerTick() {
    const target = new Date(2026, 7, 26, 14, 0, 0);
    const now = new Date();
    const diff = target - now;
    if (diff <= 0) {
      document.getElementById('days').innerText = '00';
      document.getElementById('hours').innerText = '00';
      document.getElementById('minutes').innerText = '00';
      document.getElementById('seconds').innerText = '00';
      return;
    }
    const days = Math.floor(diff / (1000*60*60*24));
    const hours = Math.floor((diff % (86400000)) / 3600000);
    const mins = Math.floor((diff % 3600000) / 60000);
    const secs = Math.floor((diff % 60000) / 1000);
    document.getElementById('days').innerText = days < 10 ? '0'+days : days;
    document.getElementById('hours').innerText = hours < 10 ? '0'+hours : hours;
    document.getElementById('minutes').innerText = mins < 10 ? '0'+mins : mins;
    document.getElementById('seconds').innerText = secs < 10 ? '0'+secs : secs;
  }
  timerTick();
  setInterval(timerTick, 1000);

  const btnMap = document.getElementById('toggleMap');
  const slide = document.getElementById('mapSlide');
  let openMap = false;
  btnMap.addEventListener('click', () => {
    if (!openMap) {
      slide.classList.add('open');
      btnMap.innerHTML = '🗺️ Скрыть карту (Парк-отель Новый Век)';
      openMap = true;
    } else {
      slide.classList.remove('open');
      btnMap.innerHTML = '📍 Открыть карту (Парк-отель Новый Век, г.Энгельс)';
      openMap = false;
    }
  });
  const iframeMap = document.querySelector('.map-frame');
  iframeMap.addEventListener('click', () => {
    window.open('https://yandex.ru/maps/?ll=46.130309,51.478169&z=17&pt=46.130309,51.478169', '_blank');
  });

  const formEl = document.getElementById('rsvpForm');
  formEl.addEventListener('submit', (e) => {
    e.preventDefault();
    alert('Спасибо! Ваш ответ сохранен.');
  });
</script>
</body>
</html>
